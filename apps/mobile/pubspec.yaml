name: solutiontee_cbt
description: "SolutionTee CBT: JAMB, WAEC and NECO practice. Learn. Think. Solve."
publish_to: 'none'

version: 0.3.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_math_fork: ^0.7.4
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  go_router: ^18.1.1
  google_mobile_ads: ^9.2.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  in_app_purchase: ^3.3.1
  in_app_review: ^2.0.12
  lottie: ^3.7.0
  markdown: ^7.3.1
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  quick_actions: ^1.1.1
  record: ^7.2.0
  share_plus: ^13.3.1
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  video_player: ^2.14.1
  wakelock_plus: ^1.8.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  # Payments build used when no --flavor is given (D-061): direct = Paystack, play = Google Play.
  default-flavor: direct
  assets:
    - assets/brand/
    - assets/brand/exam-bodies/
    - assets/third_party/
    - assets/sounds/
  fonts:
    # Lilita One (SIL OFL, assets/fonts/LILITA_ONE_OFL.txt): Game Zone headings only (D-157)
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    # Phosphor icons (MIT), subset by design/scripts/phosphor-to-dart.py
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
