# Builds the website Android app and puts it on https://admin.solutiontee.com/download (D-060, D-065).
# Every push that changes the app: a quick check (analyzer + tests, ~3 minutes).
# A new version (build, emulator check, /download) only when the commit message has [release], or by hand
# (Actions → Android app → Run). The Google Play versions (preview APK + .aab) only with [play] or "Also build the
# Google Play versions" when run by hand. GitHub's free plan has 2,000 minutes a month (D-134).
# No GitHub secrets are needed: the run proves who it is to our website with GitHub's signed run token, and the
# website hands back the signing key and an upload link only to this workflow in this repository.
name: Android app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["apps/mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
    inputs:
      play:
        description: "Also build the Google Play versions (preview APK + .aab)"
        type: boolean
        default: false

# A newer check replaces an older check; a newer release replaces an older release; a check never stops a release.
concurrency:
  group: android-${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[play]') }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SITE: https://admin.solutiontee.com

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Check the code
        run: flutter analyze
      - name: Run the tests
        run: flutter test

  apk:
    needs: [check]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[play]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      name: ${{ steps.ver.outputs.name }}
      build: ${{ steps.ver.outputs.build }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Ask the website for the signing key
        run: |
          set -euo pipefail
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=solutiontee-apk" | jq -r .value)
          echo "::add-mask::$TOKEN"
          curl -sSf -X POST "$SITE/api/ci/apk" -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" -d '{"step":"start"}' -o "$RUNNER_TEMP/start.json"
          PW=$(jq -r .password "$RUNNER_TEMP/start.json")
          echo "::add-mask::$PW"
          jq -r .keystore "$RUNNER_TEMP/start.json" | base64 -d > "$RUNNER_TEMP/direct.jks"
          GS=$(jq -r '.google_services // ""' "$RUNNER_TEMP/start.json")
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > android/app/google-services.json; else echo "No Firebase file: push will be off in this build"; fi
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/direct.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$PW"
            echo "ANDROID_KEY_PASSWORD=$PW"
            echo "ANDROID_KEY_ALIAS=$(jq -r .alias "$RUNNER_TEMP/start.json")"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/start.json"

      - name: Build the APK
        run: |
          set -euo pipefail
          # The owner's laptop keeps Gradle light (CLAUDE.md §2); GitHub's machine has 16 GB, and R8 with Paystack's
          # Compose sheet needs more than 1.5 GB (D-089), so only this build gets a bigger heap.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          sed -i 's/^kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx2g/' android/gradle.properties
          # Build number = minutes since 1970, so every build installs over the last one.
          BUILD=$(( $(date +%s) / 60 ))
          NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9.]+).*/\1/')
          # GitHub's file server sometimes answers 504 while Gradle downloads itself (8 Nov 2026): try up to 3 times.
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::Build failed (try $i of 3), trying again"; sleep $((i * 30)); done; return 1; }
          retry flutter build apk --release --flavor direct --target-platform android-arm64 \
            --build-number="$BUILD" --dart-define=APP_VERSION="$NAME"
          cp build/app/outputs/flutter-apk/app-direct-release.apk "$RUNNER_TEMP/app-arm64.apk"
          # The emulator copy (x86_64) right after, while Gradle is warm: much cheaper than a second machine.
          retry flutter build apk --release --flavor direct --target-platform android-x64 \
            --build-number="$BUILD" --dart-define=APP_VERSION="$NAME"
          cp build/app/outputs/flutter-apk/app-direct-release.apk "$RUNNER_TEMP/app-x64.apk"
          echo "APP_NAME_VERSION=$NAME" >> "$GITHUB_ENV"
          echo "APP_BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Keep the APK for the publish step
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/app-arm64.apk
          retention-days: 3

      - name: Keep the emulator copy
        uses: actions/upload-artifact@v4
        with:
          name: apk-x64
          path: ${{ runner.temp }}/app-x64.apk
          retention-days: 1

      - name: Remember the version
        id: ver
        run: |
          echo "name=$APP_NAME_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$APP_BUILD" >> "$GITHUB_OUTPUT"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/direct.jks" android/app/google-services.json

  # The Google Play version (no Paystack, no self-update, Google Play Billing only) for the owner to try before Play
  # Console (D-112). Its own machine, so it never delays or blocks the direct app on /download. Same signing key and
  # build number as the direct app, so it installs over it and back.
  play:
    needs: [apk]
    if: (github.event_name == 'workflow_dispatch' && inputs.play) || contains(github.event.head_commit.message, '[play]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      APP_NAME_VERSION: ${{ needs.apk.outputs.name }}
      APP_BUILD: ${{ needs.apk.outputs.build }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Ask the website for the signing key
        run: |
          set -euo pipefail
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=solutiontee-apk" | jq -r .value)
          echo "::add-mask::$TOKEN"
          curl -sSf -X POST "$SITE/api/ci/apk" -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" -d '{"step":"start"}' -o "$RUNNER_TEMP/start.json"
          PW=$(jq -r .password "$RUNNER_TEMP/start.json")
          echo "::add-mask::$PW"
          jq -r .keystore "$RUNNER_TEMP/start.json" | base64 -d > "$RUNNER_TEMP/direct.jks"
          GS=$(jq -r '.google_services // ""' "$RUNNER_TEMP/start.json")
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > android/app/google-services.json; else echo "No Firebase file: push will be off in this build"; fi
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/direct.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$PW"
            echo "ANDROID_KEY_PASSWORD=$PW"
            echo "ANDROID_KEY_ALIAS=$(jq -r .alias "$RUNNER_TEMP/start.json")"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/start.json"

      - name: Build the Google Play APK
        run: |
          set -euo pipefail
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          sed -i 's/^kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx2g/' android/gradle.properties
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::Build failed (try $i of 3), trying again"; sleep $((i * 30)); done; return 1; }
          retry flutter build apk --release --flavor play --target-platform android-arm64 \
            --build-number="$APP_BUILD" --dart-define=APP_VERSION="$APP_NAME_VERSION"
          cp build/app/outputs/flutter-apk/app-play-release.apk "$RUNNER_TEMP/app-play-arm64.apk"

      - name: Keep the Google Play APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-play
          path: ${{ runner.temp }}/app-play-arm64.apk
          retention-days: 3

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/direct.jks" android/app/google-services.json

  # The file to upload to Google Play Console (D-118): an Android App Bundle of the Play version, signed with our key
  # (Play Console uses it as the upload key). Its own machine, after the direct app, so it never blocks /download.
  aab:
    needs: [apk]
    if: (github.event_name == 'workflow_dispatch' && inputs.play) || contains(github.event.head_commit.message, '[play]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      APP_NAME_VERSION: ${{ needs.apk.outputs.name }}
      APP_BUILD: ${{ needs.apk.outputs.build }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Ask the website for the signing key
        run: |
          set -euo pipefail
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=solutiontee-apk" | jq -r .value)
          echo "::add-mask::$TOKEN"
          curl -sSf -X POST "$SITE/api/ci/apk" -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" -d '{"step":"start"}' -o "$RUNNER_TEMP/start.json"
          PW=$(jq -r .password "$RUNNER_TEMP/start.json")
          echo "::add-mask::$PW"
          jq -r .keystore "$RUNNER_TEMP/start.json" | base64 -d > "$RUNNER_TEMP/direct.jks"
          GS=$(jq -r '.google_services // ""' "$RUNNER_TEMP/start.json")
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > android/app/google-services.json; else echo "No Firebase file: push will be off in this build"; fi
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/direct.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$PW"
            echo "ANDROID_KEY_PASSWORD=$PW"
            echo "ANDROID_KEY_ALIAS=$(jq -r .alias "$RUNNER_TEMP/start.json")"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/start.json"

      - name: Build the Google Play Console bundle (.aab)
        run: |
          set -euo pipefail
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          sed -i 's/^kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx2g/' android/gradle.properties
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::Build failed (try $i of 3), trying again"; sleep $((i * 30)); done; return 1; }
          retry flutter build appbundle --release --flavor play \
            --build-number="$APP_BUILD" --dart-define=APP_VERSION="$APP_NAME_VERSION"
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "$RUNNER_TEMP/app-play.aab"

      - name: Keep the Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: ${{ runner.temp }}/app-play.aab
          retention-days: 3

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/direct.jks" android/app/google-services.json

  # Never put a broken app on /download: the same app is built for x86_64 on a second machine, installed on an
  # Android 14 emulator, opened and checked to keep running (tool/smoke_test.sh). Big update 2, after the ads crash.
  emulator:
    needs: [apk]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: apps/mobile/tool
      - uses: actions/download-artifact@v4
        with:
          name: apk-x64
          path: ${{ runner.temp }}
      - name: Let the emulator use the CPU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: apps/mobile
          script: ./tool/smoke_test.sh "$RUNNER_TEMP/app-x64.apk" "$RUNNER_TEMP/smoke"
      - name: Keep the emulator screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-check
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

  publish:
    needs: [apk, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_NAME_VERSION: ${{ needs.apk.outputs.name }}
      APP_BUILD: ${{ needs.apk.outputs.build }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}
      - name: Put it on /download
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/app-arm64.apk"
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VERSION="$APP_NAME_VERSION-$(date -u +%Y%m%d%H%M)"
          APK="solutiontee-cbt-$VERSION.apk"
          token() { curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=solutiontee-apk" | jq -r .value; }
          TOKEN=$(token); echo "::add-mask::$TOKEN"
          URL=$(curl -sSf -X POST "$SITE/api/ci/apk" -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" \
            -d "{\"step\":\"upload\",\"name\":\"$APK\"}" | jq -r .url)
          echo "::add-mask::$URL"
          curl -sSf -X PUT -H "content-type: application/vnd.android.package-archive" --upload-file "$FILE" "$URL" -o /dev/null
          TOKEN=$(token); echo "::add-mask::$TOKEN"
          curl -sSf -X POST "$SITE/api/ci/apk" -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" \
            -d "{\"step\":\"publish\",\"name\":\"$APK\",\"version\":\"$VERSION\",\"built_at\":\"$BUILT\",\"build\":$APP_BUILD}"
          echo
          echo "### The new app is on $SITE/download (version $VERSION, $(du -m "$FILE" | cut -f1) MB)" >> "$GITHUB_STEP_SUMMARY"

  publish-play:
    needs: [apk, play, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_NAME_VERSION: ${{ needs.apk.outputs.name }}
      APP_BUILD: ${{ needs.apk.outputs.build }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-play
          path: ${{ runner.temp }}
      - name: Put the Google Play version on /download?channel=play
        run: |
          set -euo pipefail
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VERSION="$APP_NAME_VERSION-$(date -u +%Y%m%d%H%M)"
          token() { curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=solutiontee-apk" | jq -r .value; }
          # The Google Play version goes to /download?channel=play ("publish-play"; a website without it just says no).
          PLAY="$RUNNER_TEMP/app-play-arm64.apk"
          if [ -f "$PLAY" ]; then
            PAPK="solutiontee-cbt-$VERSION-play.apk"
            TOKEN=$(token); echo "::add-mask::$TOKEN"
            URL=$(curl -sSf -X POST "$SITE/api/ci/apk" -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" \
              -d "{\"step\":\"upload\",\"name\":\"$PAPK\"}" | jq -r .url)
            echo "::add-mask::$URL"
            curl -sSf -X PUT -H "content-type: application/vnd.android.package-archive" --upload-file "$PLAY" "$URL" -o /dev/null
            TOKEN=$(token); echo "::add-mask::$TOKEN"
            curl -sS -X POST "$SITE/api/ci/apk" -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" \
              -d "{\"step\":\"publish-play\",\"name\":\"$PAPK\",\"version\":\"$VERSION\",\"built_at\":\"$BUILT\",\"build\":$APP_BUILD}" || true
            echo
            echo "### Google Play version: $SITE/download?channel=play" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-aab:
    needs: [apk, aab, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_NAME_VERSION: ${{ needs.apk.outputs.name }}
      APP_BUILD: ${{ needs.apk.outputs.build }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aab
          path: ${{ runner.temp }}
      - name: Put the Google Play Console file on /download/aab
        run: |
          set -euo pipefail
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VERSION="$APP_NAME_VERSION-$(date -u +%Y%m%d%H%M)"
          FILE="$RUNNER_TEMP/app-play.aab"
          NAME="solutiontee-cbt-$VERSION.aab"
          token() { curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=solutiontee-apk" | jq -r .value; }
          TOKEN=$(token); echo "::add-mask::$TOKEN"
          URL=$(curl -sSf -X POST "$SITE/api/ci/apk" -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" \
            -d "{\"step\":\"upload\",\"name\":\"$NAME\"}" | jq -r .url)
          echo "::add-mask::$URL"
          curl -sSf -X PUT -H "content-type: application/octet-stream" --upload-file "$FILE" "$URL" -o /dev/null
          TOKEN=$(token); echo "::add-mask::$TOKEN"
          curl -sS -X POST "$SITE/api/ci/apk" -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" \
            -d "{\"step\":\"publish-aab\",\"name\":\"$NAME\",\"version\":\"$VERSION\",\"built_at\":\"$BUILT\",\"build\":$APP_BUILD}" || true
          echo
          echo "### Google Play Console file (.aab): $SITE/download/aab (version $VERSION)" >> "$GITHUB_STEP_SUMMARY"
