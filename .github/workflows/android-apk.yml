# Builds the website Android app and puts it on https://admin.solutiontee.com/download (D-060, D-065).
# Runs on every push to main or a claude/* branch that changes the app, or by hand (Actions → Android app → Run).
# No GitHub secrets are needed: the run proves who it is to our website with GitHub's signed run token, and the
# website hands back the signing key and an upload link only to this workflow in this repository.
name: Android app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["apps/mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SITE: https://admin.solutiontee.com

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check the code
        run: flutter analyze

      - name: Run the tests
        run: flutter test

      - name: Ask the website for the signing key
        run: |
          set -euo pipefail
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=solutiontee-apk" | jq -r .value)
          echo "::add-mask::$TOKEN"
          curl -sSf -X POST "$SITE/api/ci/apk" -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" -d '{"step":"start"}' -o "$RUNNER_TEMP/start.json"
          PW=$(jq -r .password "$RUNNER_TEMP/start.json")
          echo "::add-mask::$PW"
          jq -r .keystore "$RUNNER_TEMP/start.json" | base64 -d > "$RUNNER_TEMP/direct.jks"
          GS=$(jq -r '.google_services // ""' "$RUNNER_TEMP/start.json")
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > android/app/google-services.json; else echo "No Firebase file: push will be off in this build"; fi
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/direct.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$PW"
            echo "ANDROID_KEY_PASSWORD=$PW"
            echo "ANDROID_KEY_ALIAS=$(jq -r .alias "$RUNNER_TEMP/start.json")"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/start.json"

      - name: Build the APK
        run: |
          set -euo pipefail
          # The owner's laptop keeps Gradle light (CLAUDE.md §2); GitHub's machine has 16 GB, and R8 with Paystack's
          # Compose sheet needs more than 1.5 GB (D-089), so only this build gets a bigger heap.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          sed -i 's/^kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx2g/' android/gradle.properties
          # Build number = minutes since 1970, so every build installs over the last one.
          BUILD=$(( $(date +%s) / 60 ))
          NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9.]+).*/\1/')
          flutter build apk --release --flavor direct --target-platform android-arm64 \
            --build-number="$BUILD" --dart-define=APP_VERSION="$NAME"
          echo "APP_NAME_VERSION=$NAME" >> "$GITHUB_ENV"
          echo "APP_BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Put it on /download
        run: |
          set -euo pipefail
          FILE=build/app/outputs/flutter-apk/app-direct-release.apk
          BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VERSION="$APP_NAME_VERSION-$(date -u +%Y%m%d%H%M)"
          APK="solutiontee-cbt-$VERSION.apk"
          token() { curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=solutiontee-apk" | jq -r .value; }
          TOKEN=$(token); echo "::add-mask::$TOKEN"
          URL=$(curl -sSf -X POST "$SITE/api/ci/apk" -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" \
            -d "{\"step\":\"upload\",\"name\":\"$APK\"}" | jq -r .url)
          echo "::add-mask::$URL"
          curl -sSf -X PUT -H "content-type: application/vnd.android.package-archive" --upload-file "$FILE" "$URL" -o /dev/null
          TOKEN=$(token); echo "::add-mask::$TOKEN"
          curl -sSf -X POST "$SITE/api/ci/apk" -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" \
            -d "{\"step\":\"publish\",\"name\":\"$APK\",\"version\":\"$VERSION\",\"built_at\":\"$BUILT\",\"build\":$APP_BUILD}"
          echo
          echo "### The new app is on $SITE/download (version $VERSION, $(du -m "$FILE" | cut -f1) MB)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/direct.jks" android/app/google-services.json
